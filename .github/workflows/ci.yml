name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-alpine3.24
        env:
          POSTGRES_DB: medical_passport
          POSTGRES_USER: medical_passport
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical_passport -d medical_passport"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret-with-more-than-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://medical_passport:ci-only-password@localhost:5432/medical_passport
      DOCUMENT_ENCRYPTION_KEYS: "[]"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Check Python formatting
        run: ruff format --check app tests
        working-directory: backend
      - name: Lint Python
        run: ruff check app tests
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - name: Apply and check PostgreSQL migrations
        run: alembic upgrade head && alembic check
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Lint frontend
        run: npx eslint src
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          API_ORIGIN: http://127.0.0.1:8010

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: ci-e2e-test-secret-with-more-than-thirty-two-characters
      DATABASE_URL: sqlite:///./medical_passport_e2e.db
      DOCUMENT_STORAGE_PATH: ./e2e-private
      DOCUMENT_ENCRYPTION_KEYS: "[]"
      EMAIL_TEST_HOOK_ENABLED: "true"
      CORS_ORIGINS: '["http://127.0.0.1:3100"]'
      PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Apply isolated SQLite migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Start backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/medical-passport-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/medical-passport-api.log
          exit 1
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          API_ORIGIN: http://127.0.0.1:8010
      - name: Start frontend
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/medical-passport-web.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/medical-passport-web.log
          exit 1
        working-directory: frontend
        env:
          API_ORIGIN: http://127.0.0.1:8010
      - name: Run browser journey
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
          E2E_SCREENSHOT_DIR: /tmp/medical-passport-e2e
